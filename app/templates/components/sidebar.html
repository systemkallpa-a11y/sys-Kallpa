<!-- Sidebar Navigation
     - Escritorio: expandido (18rem) o compacto solo iconos (4.5rem), con transición de ancho.
     - Móvil: cajón lateral que entra/sale deslizándose.
     - El botón que lo controla es #mobile-menu-btn (header de base.html).
     Estilos en responsive.css (sección "Sidebar"); lógica en sidebar.js y sidebar-accesos.js. -->
<aside id="sidebar" aria-label="Menú principal" class="k-sidebar flex flex-col flex-shrink-0 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-800">

    <!-- Marca: enlace al Dashboard -->
    <!-- box-content: 64px + 1px de borde = mismo alto que el header (bordes alineados) -->
    <div class="k-sidebar-cabecera box-content flex items-center h-16 px-4 border-b border-gray-200 dark:border-slate-800 flex-shrink-0">
        <a href="{{ url_for('main.dashboard') }}" title="Ir al Dashboard" class="flex items-center gap-3 min-w-0 rounded-lg">
            <span class="flex-shrink-0 w-10 h-10 rounded-xl bg-white flex items-center justify-center shadow-sm ring-1 ring-black/5">
                <img src="{{ url_for('static', filename='images/Logo Kallpa.png') }}" alt="" width="32" height="32" class="w-8 h-8 object-contain">
            </span>
            <span class="k-etiqueta text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Kallpa</span>
        </a>
        <!-- Cerrar (solo móvil) -->
        <button type="button" id="sidebar-cerrar-movil" aria-label="Cerrar menú" class="md:hidden ml-auto w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-white transition-colors">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Navegación (se llena desde sidebar-accesos.js) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-4">
        <div id="menu-container" class="space-y-1" aria-busy="true">
            <!-- Esqueleto de carga -->
            <div class="k-esqueleto space-y-2" aria-hidden="true">
                <div class="h-10 rounded-lg bg-gray-100 dark:bg-slate-800 animate-pulse"></div>
                <div class="h-10 rounded-lg bg-gray-100 dark:bg-slate-800 animate-pulse"></div>
                <div class="h-10 rounded-lg bg-gray-100 dark:bg-slate-800 animate-pulse"></div>
                <div class="h-10 rounded-lg bg-gray-100 dark:bg-slate-800 animate-pulse"></div>
                <div class="h-10 rounded-lg bg-gray-100 dark:bg-slate-800 animate-pulse"></div>
            </div>
            <span class="sr-only" role="status">Cargando menú…</span>
        </div>
    </nav>
</aside>

<!-- Aplicar el estado compacto guardado ANTES de pintar (evita parpadeo y animación al cargar) -->
<script>
(function () {
    try {
        if (window.innerWidth >= 768 && localStorage.getItem('sidebar-colapsado') === '1') {
            document.getElementById('sidebar').classList.add('sidebar-compacto');
        }
    } catch (e) { /* sin localStorage: se queda expandido */ }
    document.getElementById('sidebar').classList.add('k-sin-transicion');
})();
</script>

<!-- Fondo oscuro del cajón en móvil -->
<div id="sidebar-overlay" class="md:hidden fixed inset-0 bg-black/50" aria-hidden="true"></div>
